<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15295a">
  <title>Results · Modi Lipi XAI</title>
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Noto+Sans+Modi&display=swap">
  <link rel="stylesheet" href="css/paper.css">
</head>
<body data-page="results">
  <header class="masthead short">
    <div class="wrap">
      <div class="kicker">Evaluation</div>
      <h1>Results</h1>
      <p class="lede">Fixed test set of 200 images for each of the 57 characters. Every number below is measured, not quoted.</p>
    </div>
    <div data-art="strip"></div>
  </header>

  <main class="wrap">
    <div class="tabs" role="tablist" aria-label="Result views">
      <button role="tab" data-tab="curve">Curve</button>
      <button role="tab" data-tab="models">Models</button>
      <button role="tab" data-tab="features">Features</button>
      <button role="tab" data-tab="errors">Errors</button>
      <button role="tab" data-tab="segment">Words</button>
      <button role="tab" data-tab="papers">Papers</button>
    </div>

    <section class="panel" id="panel-curve" role="tabpanel">
      <div class="card"><div class="skeleton" style="height:240px"></div></div>
    </section>
    <section class="panel" id="panel-models" role="tabpanel" hidden></section>
    <section class="panel" id="panel-features" role="tabpanel" hidden></section>
    <section class="panel" id="panel-errors" role="tabpanel" hidden></section>
    <section class="panel" id="panel-segment" role="tabpanel" hidden></section>
    <section class="panel" id="panel-papers" role="tabpanel" hidden></section>
    <p class="foot-note">Figures for the report are in results/figures; numbers in results/metrics.</p>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
